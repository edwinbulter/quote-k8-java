apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api-native
  namespace: quote-k8-java
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quote-api
      mode: native
  template:
    metadata:
      labels:
        app: quote-api
        mode: native
    spec:
      containers:
        - name: quote-api
          image: quote-api:latest-native
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
