apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api-jvm
  namespace: quote-k8-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote-api
      mode: jvm
  template:
    metadata:
      labels:
        app: quote-api
        mode: jvm
    spec:
      containers:
        - name: quote-api
          image: quote-api:latest-jvm
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
